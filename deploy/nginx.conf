# nginx for https://ex88.ru serving dist/ (after `node scripts/build.mjs`).
# Mirrors dist/_redirects and dist/_headers, which are the Netlify version of the same rules.
# Certificate paths are placeholders: keep the ones the server already uses.

# http://ex88.ru, http://www.ex88.ru -> https://ex88.ru (one hop)
server {
    listen 80;
    listen [::]:80;
    server_name ex88.ru www.ex88.ru;
    return 301 https://ex88.ru$request_uri;
}

# https://www.ex88.ru -> https://ex88.ru (needs a certificate that covers www and a DNS record for www)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ex88.ru;
    ssl_certificate     /etc/letsencrypt/live/ex88.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ex88.ru/privkey.pem;
    return 301 https://ex88.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ex88.ru;
    ssl_certificate     /etc/letsencrypt/live/ex88.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ex88.ru/privkey.pem;

    root /var/www/ex88/dist;
    charset utf-8;

    # Compression (brotli needs ngx_brotli; gzip is built in)
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    # brotli on;
    # brotli_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Language root and the addresses of the previous site
    location = /             { return 301 /ru; }
    location = /index.html   { return 301 /ru; }
    location = /legal        { return 301 /ru/terms; }
    location ~ ^/(terms|privacy|cookies)(\.html)?$ { return 301 /ru/$1; }

    # One URL per page: no trailing slash, no .html
    location ~ ^/(ru|en)/$                              { return 301 /$1; }
    location ~ ^/(ru|en)/(terms|privacy|cookies)/$      { return 301 /$1/$2; }
    location ~ ^/(ru|en)(/(terms|privacy|cookies))?\.html$ { return 301 /$1$2; }

    location ~ ^/(ru|en)(/(terms|privacy|cookies))?$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri.html =404;
    }

    # Hashed script and fonts never change under the same name
    location ~ ^/assets/(js|fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /assets/img/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /robots.txt  { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }

    # Netlify and local preview files are not part of the site
    location ~ ^/(_redirects|_headers|serve\.json)$ { return 404; }

    location / { try_files $uri =404; }
}
